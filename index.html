<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jar of Wins</title>
    <!-- Lively Fonts -->
    <link href="https://fonts.googleapis.com" rel="stylesheet">
    <style>
        :root {
            --bg: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --glass: rgba(255, 255, 255, 0.15);
            --border: rgba(255, 255, 255, 0.3);
            --accent: #ff007a;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            background: var(--bg);
            margin: 0; height: 100vh;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: white; overflow: hidden;
        }

        h1 { font-family: 'Fredoka One', cursive; font-size: 2.5rem; text-shadow: 2px 2px 10px rgba(0,0,0,0.2); }

        .game-world {
            display: flex; gap: 60px; align-items: center;
        }

        .jar-container {
            display: flex; flex-direction: column; align-items: center; gap: 15px;
        }

        /* Glassmorphism Jars */
        .jar {
            width: 180px; height: 260px;
            background: var(--glass);
            backdrop-filter: blur(10px);
            border: 2px solid var(--border);
            border-radius: 20px 20px 60px 60px;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
            position: relative;
            padding: 15px;
            display: flex; flex-wrap: wrap-reverse; align-content: flex-start; gap: 8px;
            transition: transform 0.3s ease;
        }

        .jar.over { transform: scale(1.05); border-color: #fff; background: rgba(255,255,255,0.25); }

        /* The Marbles */
        .marble {
            width: 35px; height: 35px;
            border-radius: 50%;
            cursor: grab;
            box-shadow: inset -5px -5px 10px rgba(0,0,0,0.3), 2px 2px 5px rgba(0,0,0,0.2);
            transition: transform 0.2s;
            z-index: 10;
        }

        .marble:active { cursor: grabbing; transform: scale(0.9); }

        .counter {
            font-size: 1.2rem; font-weight: bold; background: white; color: #764ba2;
            padding: 5px 20px; border-radius: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .label { font-weight: bold; letter-spacing: 1px; text-transform: uppercase; opacity: 0.8; }
    </style>
</head>
<body>

    <h1>Your Win Jar</h1>

    <div class="game-world">
        <div class="jar-container">
            <span class="label">Missions</span>
            <div id="todo-jar" class="jar" ondrop="drop(event)" ondragover="allowDrop(event)">
                <div class="marble" draggable="true" ondragstart="drag(event)" id="m1" style="background: radial-gradient(circle at 30% 30%, #ff9a9e, #fecfef);"></div>
                <div class="marble" draggable="true" ondragstart="drag(event)" id="m2" style="background: radial-gradient(circle at 30% 30%, #a1c4fd, #c2e9fb);"></div>
                <div class="marble" draggable="true" ondragstart="drag(event)" id="m3" style="background: radial-gradient(circle at 30% 30%, #84fab0, #8fd3f4);"></div>
                <div class="marble" draggable="true" ondragstart="drag(event)" id="m4" style="background: radial-gradient(circle at 30% 30%, #fccb90, #d57eeb);"></div>
            </div>
        </div>

        <div class="jar-container">
            <span class="label">Accomplished</span>
            <div id="success-jar" class="jar" ondrop="drop(event)" ondragover="allowDrop(event)" ondragenter="this.classList.add('over')" ondragleave="this.classList.remove('over')">
            </div>
            <div class="counter" id="count">0 Wins</div>
        </div>
    </div>

    <script>
        function allowDrop(ev) {
            ev.preventDefault();
        }

        function drag(ev) {
            ev.dataTransfer.setData("text", ev.target.id);
        }

        function drop(ev) {
            ev.preventDefault();
            const data = ev.dataTransfer.getData("text");
            const marble = document.getElementById(data);
            const targetJar = ev.target.closest('.jar');
            
            if (targetJar) {
                targetJar.appendChild(marble);
                targetJar.classList.remove('over');
                updateCounter();
            }
        }

        function updateCounter() {
            const count = document.getElementById('success-jar').children.length;
            document.getElementById('count').innerText = `${count} Wins`;
        }
    </script>
</body>
</html>
