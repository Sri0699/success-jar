<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' https://*.gstatic.com https://*.googleapis.com https://*.firebaseapp.com; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://apis.google.com https://*.firebaseapp.com; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com https://*.firebaseapp.com;media-src 'self' https://www.soundjay.com">
    <title>Mission Control | Success Jar</title>
    <style>
        :root { --color1: #ff007a; --color2: #764ba2; --color3: #667eea; --glass: rgba(255, 255, 255, 0.1); --border: rgba(255, 255, 255, 0.2); --font-main: 'Courier New', Courier, monospace; }
        body { font-family: var(--font-main); margin: 0; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; overflow: hidden; background: #0f172a; position: relative; }
        body::before { content: ""; position: absolute; width: 300%; height: 300%; top: -100%; left: -100%; background: radial-gradient(circle at center, var(--color1) 0%, transparent 20%), radial-gradient(circle at 20% 30%, var(--color2) 0%, transparent 25%), radial-gradient(circle at 80% 70%, var(--color3) 0%, transparent 25%); filter: blur(100px); z-index: -1; animation: aurora 30s linear infinite; opacity: 0.4; }
        @keyframes aurora { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .header { position: absolute; top: 30px; width: 85%; display: flex; justify-content: space-between; align-items: center; }
        .dashboard { display: flex; gap: 40px; background: var(--glass); padding: 15px 30px; border-radius: 10px; border: 1px solid var(--border); backdrop-filter: blur(10px); }
        .stat-box { text-align: center; }
        .stat-val { font-size: 2rem; font-weight: bold; display: block; color: var(--color1); }
        .stat-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 2px; opacity: 0.6; }
        .auth-btn { background: white; color: black; border: none; padding: 10px 20px; font-family: var(--font-main); cursor: pointer; border-radius: 5px; font-weight: bold; }
        #user-greet { font-size: 0.8rem; margin-right: 15px; text-transform: uppercase; border-right: 2px solid var(--color1); padding-right: 10px; }
        .game-world { display: flex; gap: 80px; align-items: flex-end; margin-top: 50px; }
        .jar { width: 180px; height: 280px; background: var(--glass); border: 2px solid var(--border); border-radius: 20px 20px 80px 80px; padding: 20px; display: flex; flex-wrap: wrap-reverse; align-content: flex-start; gap: 10px; transition: 0.3s; }
        .jar.over { transform: scale(1.1); border-color: white; box-shadow: 0 0 40px var(--color1); }
        .marble { width: 38px; height: 38px; border-radius: 50%; cursor: grab; box-shadow: inset -5px -5px 10px rgba(0,0,0,0.5); z-index: 10; }
        .controls { margin-top: 40px; display: flex; gap: 15px; align-items: center; background: var(--glass); padding: 15px; border-radius: 10px; border: 1px solid var(--border); }
        input { background: rgba(0,0,0,0.3); border: 1px solid var(--border); color: white; padding: 10px; width: 50px; border-radius: 5px; font-family: var(--font-main); text-align: center; }
        .btn-gen { background: var(--color1); color: white; border: none; padding: 12px 25px; border-radius: 5px; cursor: pointer; font-family: var(--font-main); font-weight: bold; }
        /* Timer Control Styles */
        .timer-controls { display: flex; gap: 5px; margin-top: 5px; }
        .btn-t { background: #43e97b; border: none; padding: 4px 8px; font-family: var(--font-main); font-size: 0.6rem; cursor: pointer; border-radius: 3px; font-weight: bold; }
        .btn-t.stop { background: var(--color1); color: white; }

        /* Visual Reset Button */
        .btn-clear { background: none; border: 1px solid var(--border); color: white; font-size: 0.6rem; padding: 5px; cursor: pointer; margin-top: 10px; opacity: 0.5; }
        .btn-clear:hover { opacity: 1; }
        .user-controls {display: flex;align-items: center;gap: 12px;}
    </style>
</head>
<body>
    <div class="header">
        <div class="dashboard">
            <!-- Total Wins Box -->
            <div class="stat-box">
                <span class="stat-val" id="total-wins">00</span>
                <span class="stat-label">Total Wins</span>
                <!-- New Hard Reset Button -->
                <button class="btn-clear" id="reset-database" style="color: var(--color1); border-color: var(--color1);">RESET_ALL_DATA</button>
            </div>

            <!-- Timer Box -->
            <div class="stat-box">
                <span class="stat-val" id="timer">00:00</span>
                <div class="timer-controls">
                    <button class="btn-t" id="timer-btn">START</button>
                    <button class="btn-t" id="timer-reset">RESET</button>
                </div>
            </div>
        </div>

        <div class="user-controls">
            <span id="user-greet">SYSTEM_OFFLINE</span>
            <button class="auth-btn" id="login-btn">AUTH_GOOGLE</button>
             <!-- New Log Out Button (Hidden by default) -->
            <button class="auth-btn" id="logout-btn" style="display:none; background:rgba(255,255,255,0.1); color:white; border:1px solid var(--border);">LOG_OUT</button>
        </div>
    </div>

    <div class="game-world">
        <div class="jar-wrap">
            <div class="jar" id="todo-jar" ondrop="drop(event)" ondragover="allowDrop(event)"></div>
        </div>
        <div class="jar-wrap">
            <div class="jar" id="success-jar" ondrop="drop(event)" ondragover="allowDrop(event)" ondragenter="this.classList.add('over')" ondragleave="this.classList.remove('over')"></div>
            <button class="btn-clear" id="clear-vault">EMPTY_VISUALLY</button>
        </div>
    </div>

    <div class="controls">
        <span>LOAD_MISSIONS:</span>
        <input type="number" id="mission-input" value="3" min="1" max="100">
        <button class="btn-gen" id="gen-btn">EXECUTE</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC_TNKPkm4jBufu3_FlyP896nyfn5dc9sM",
            authDomain: "successjar-ccc2c.firebaseapp.com",
            projectId: "successjar-ccc2c",
            storageBucket: "successjar-ccc2c.firebasestorage.app",
            messagingSenderId: "952065804364",
            appId: "1:952065804364:web:954859186130904a4d8ce9"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();
        const clink = new Audio('https://www.soundjay.com');

        let currentUser = null;
        let winCount = 0;
        let seconds = 0;
        let timerInterval = null;

        // --- MARBLE GENERATION (Capped at 100 to prevent hanging) ---
        const generateMarbles = () => {
            const jar = document.getElementById('todo-jar');
            const count = Math.min(document.getElementById('mission-input').value, 100);
            jar.innerHTML = '';
            for(let i=0; i<count; i++) {
                const m = document.createElement('div');
                m.className = 'marble'; m.draggable = true; m.id = 'm' + Date.now() + i;
                m.style.background = `radial-gradient(circle at 30% 30%, hsla(${Math.random()*360}, 70%, 50%, 1), #000)`;
                m.ondragstart = (e) => e.dataTransfer.setData("text", e.target.id);
                jar.appendChild(m);
            }
        };

        document.getElementById('gen-btn').onclick = generateMarbles;

        // --- AUTH ---
        document.getElementById('login-btn').onclick = () => {
            signInWithPopup(auth, provider).catch(err => alert("Error: " + err.message));
        };

        onAuthStateChanged(auth, async (user) => {
    const loginBtn = document.getElementById('login-btn');
    const logoutBtn = document.getElementById('logout-btn');
    const userGreet = document.getElementById('user-greet');

    if (user) {
        currentUser = user;
        // 1. Show Name & Toggle Buttons
        userGreet.innerText = `USER: ${user.displayName.toUpperCase().split(' ')[0]}`;
        loginBtn.style.display = 'none';
        logoutBtn.style.display = 'inline-block';
        
        // 2. Fetch Cloud Data
        const docSnap = await getDoc(doc(db, "users", user.uid));
        if (docSnap.exists()) {
            winCount = docSnap.data().wins || 0;
            document.getElementById('total-wins').innerText = winCount.toString().padStart(2, '0');
        }
    } else {
        // 3. Reset UI on Logout
        currentUser = null;
        userGreet.innerText = `SYSTEM_OFFLINE`;
        loginBtn.style.display = 'inline-block';
        logoutBtn.style.display = 'none';
        document.getElementById('total-wins').innerText = "00";
    }
});

// --- ADD THIS LINE BELOW THE FUNCTION TO MAKE THE BUTTON WORK ---
document.getElementById('logout-btn').onclick = () => auth.signOut();

        // --- MANUAL TIMER LOGIC ---
        document.getElementById('timer-btn').onclick = function() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
                this.innerText = "START";
                this.style.background = "#43e97b";
            } else {
                timerInterval = setInterval(() => {
                    seconds++;
                    const m = Math.floor(seconds/60).toString().padStart(2,'0');
                    const s = (seconds%60).toString().padStart(2,'0');
                    document.getElementById('timer').innerText = `${m}:${s}`;
                }, 1000);
                this.innerText = "STOP";
                this.style.background = "#ff007a";
            }
        };

        document.getElementById('timer-reset').onclick = () => {
            clearInterval(timerInterval);
            timerInterval = null;
            seconds = 0;
            document.getElementById('timer').innerText = "00:00";
            document.getElementById('timer-btn').innerText = "START";
            document.getElementById('timer-btn').style.background = "#43e97b";
        };

        // --- VISUAL RESET ---
        document.getElementById('clear-vault').onclick = () => {
            if(confirm("Empty the jar visually? Wins stay saved!")) {
                document.getElementById('success-jar').innerHTML = '';
            }
        };

        // --- DROP LOGIC ---
        window.allowDrop = (e) => e.preventDefault();
        window.drop = async (e) => {
            e.preventDefault();
            const id = e.dataTransfer.getData("text");
            const marble = document.getElementById(id);
            const target = e.target.closest('.jar');
            if (target && target.id === 'success-jar' && marble.parentElement.id !== 'success-jar') {
                target.appendChild(marble);
                clink.play(); // Sound Effect
                winCount++;
                document.getElementById('total-wins').innerText = winCount.toString().padStart(2, '0');
                if (currentUser) await setDoc(doc(db, "users", currentUser.uid), { wins: winCount });
            }
        };

        generateMarbles();
    </script>
</body>
